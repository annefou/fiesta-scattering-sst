name: CI smoke run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      # Hermetic smoke test: a synthetic SST field instead of the Copernicus
      # downloads, so PR checks need no credentials and do not depend on
      # Copernicus Marine authentication. The Jupyter Book runs the real data.
      SYNTHETIC_SST: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: fiesta-scattering-sst
          init-shell: bash
          cache-environment: true

      - name: Run notebook
        shell: micromamba-shell {0}
        run: |
          jupytext --to notebook 01_sst_gap_filling.py
          jupyter execute --inplace 01_sst_gap_filling.ipynb
